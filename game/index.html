<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Sort & Learn · Bag Day game</title><link rel="stylesheet" href="game.css?v=1.0.36"></head>
<body><main class="sort-game">
<header class="game-header"><button id="backToBagDay" class="back-button" type="button">‹ Back to Bag Day</button></header>
<section id="gameMenu" class="menu-panel" aria-labelledby="menuTitle"><h1 id="menuTitle">The Sorting Game</h1><div class="level-row"><select id="levelChoice" aria-label="Level"></select></div><div class="menu-bags"><div><img src="assets/bag-organic.svg" alt="Organic bag"></div><div><img src="assets/bag-mixed.svg" alt="Mixed waste bag"></div><div><img src="assets/bag-recycle.svg" alt="Recycling bag"></div></div><button id="startGame" class="primary-button" type="button">Play ▶</button></section>
<section id="gamePlay" class="play-panel" hidden aria-label="Sorting game"><div class="scorebar"><span>Level <strong id="playingLevel">1</strong></span><span class="correct-score">✓ <strong id="hitCount">0</strong><small>correct</small></span><span class="wrong-score">✕ <strong id="missCount">0</strong><small>wrong</small></span><span class="timer-score"><strong id="timeLeft" aria-label="Time remaining">1:00</strong><small>Time left</small></span><button id="pauseGame" type="button" aria-label="Pause game">Ⅱ</button></div>
<div id="conveyor" class="conveyor" aria-label="Three sorting lanes"><div class="belt-lines" aria-hidden="true"><span></span><span></span><span></span></div><div id="fallingItems"></div><img id="pushHand" class="push-hand" src="assets/hand.svg" alt="" hidden><div id="feedback" class="feedback" role="status" aria-live="polite"></div></div>
<div id="gameBags" class="game-bags"><button data-lane="0" type="button" aria-label="Send selected item to Organic"><span class="bag-feedback" aria-hidden="true"></span><img src="assets/bag-organic.svg" alt=""><strong>Organic</strong></button><button data-lane="1" type="button" aria-label="Send selected item to Mixed"><span class="bag-feedback" aria-hidden="true"></span><img src="assets/bag-mixed.svg" alt=""><strong>Mixed</strong></button><button data-lane="2" type="button" aria-label="Send selected item to Recyclables"><span class="bag-feedback" aria-hidden="true"></span><img src="assets/bag-recycle.svg" alt=""><strong>Recyclables</strong></button></div><p id="controlHint" class="control-hint">Push sideways to sort · push down to send</p></section>
<section id="gameResults" class="results-panel" hidden aria-labelledby="resultsTitle" tabindex="-1"><h1 id="resultsTitle">Try Again ?</h1><p id="resultSummary"></p><div id="resultActions" class="result-actions"><button id="replayLevel" class="primary-button" type="button">Play ▶</button></div><div id="reviewList" class="review-list"></div></section>
<div id="pausePanel" class="pause-overlay" hidden><section role="dialog" aria-modal="true" aria-labelledby="pauseTitle"><h2 id="pauseTitle">Game paused</h2><p>The belt and timer are stopped.</p><button id="resumeGame" class="primary-button" type="button">Resume</button><button id="endPractice" type="button">Finish this round</button><button id="quitRound" type="button">Choose a level</button></section></div>
</main><script src="items.js?v=1.0.36"></script><script src="game.js?v=1.0.36"></script></body></html>
