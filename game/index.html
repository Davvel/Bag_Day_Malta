<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Sort & Learn · Bag Day game</title><link rel="stylesheet" href="game.css?v=1.0.59"></head>
<body><main class="sort-game">
<section id="gameMenu" class="menu-panel" aria-labelledby="menuTitle"><button id="closeGameMenu" class="circle-control panel-close" type="button" aria-label="Close game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div class="lobby-content"><h1 id="menuTitle">The Sorting Game</h1><div class="game-records" aria-label="Your records"><div class="record level-record"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10v6a5 5 0 0 1-10 0V3ZM7 5H3v2c0 4 2 5 5 5M17 5h4v2c0 4-2 5-5 5M12 14v6M7 21h10"/></svg></span><strong id="highestLevel">0</strong><small>Highest level achieved</small></div><div class="record score-record"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.1 6.3 7 .9-5.1 5 1.2 7-6.2-3.3-6.2 3.3 1.2-7-5.1-5 7-.9Z"/></svg></span><strong id="bestRound">0</strong><small>Most correct in one round</small></div><div class="record streak-record"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2c1 6-5 7-4 12-2-1-2-3-2-4-5 6-2 12 5 12 8 0 10-8 6-13 0 3-2 4-3 4 2-4 0-8-2-11Z"/></svg></span><strong id="currentStreak">0</strong><small>Current streak · days</small></div><div class="record longest-record"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 1 3 14h8L9 23l12-14h-8Z"/></svg></span><strong id="longestStreak">0</strong><small>Longest streak · days</small></div></div><div class="level-row"><label for="levelChoice">Level</label><select id="levelChoice" aria-label="Level"></select></div><button id="startGame" class="primary-button" type="button">Play ▶</button><div class="menu-bags"><div><img src="assets/bag-organic.svg" alt="Organic bag"></div><div><img src="assets/bag-mixed.svg" alt="Mixed waste bag"></div><div><img src="assets/bag-recycle.svg" alt="Recycling bag"></div></div></div></section>
<section id="gamePlay" class="play-panel" hidden aria-label="Sorting game"><div class="scorebar"><span>Level <strong id="playingLevel">1</strong></span><span class="correct-score">✓ <strong id="hitCount">0</strong><small>correct</small></span><span class="wrong-score">✕ <strong id="missCount">0</strong><small>wrong</small></span><span class="timer-score"><strong id="timeLeft" aria-label="Time remaining">1:00</strong><small>Time left</small></span><div class="game-controls"><button id="pauseGame" class="circle-control" type="button" aria-label="Pause game">Ⅱ</button><button id="closeGamePlay" class="circle-control" type="button" aria-label="Return to game home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div>
<div id="conveyor" class="conveyor" aria-label="Three sorting lanes"><div class="belt-lines" aria-hidden="true"><span></span><span></span><span></span></div><div id="fallingItems"></div><img id="pushHand" class="push-hand" src="assets/hand.svg" alt="" hidden><div id="feedback" class="visually-hidden" role="status" aria-live="polite"></div></div>
<div id="gameBags" class="game-bags"><button data-lane="0" type="button" aria-label="Send selected item to Organic"><span class="bag-feedback" aria-hidden="true"></span><img src="assets/bag-organic.svg" alt=""><strong>Organic</strong></button><button data-lane="1" type="button" aria-label="Send selected item to Mixed"><span class="bag-feedback" aria-hidden="true"></span><img src="assets/bag-mixed.svg" alt=""><strong>Mixed</strong></button><button data-lane="2" type="button" aria-label="Send selected item to Recyclables"><span class="bag-feedback" aria-hidden="true"></span><img src="assets/bag-recycle.svg" alt=""><strong>Recyclables</strong></button></div><p id="controlHint" class="control-hint">Drag to move · drop into a bag</p></section>
<section id="gameResults" class="results-panel" hidden aria-labelledby="resultsTitle" tabindex="-1"><header class="game-titlebar"><h1 id="resultsTitle">Try Again ?</h1><button id="closeGameResults" class="circle-control panel-close" type="button" aria-label="Return to game home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><p id="resultSummary"></p><div id="resultActions" class="result-actions"><button id="replayLevel" class="primary-button" type="button">Play ▶</button></div><div id="reviewList" class="review-list"></div></section>
<div id="winPanel" class="win-overlay" hidden><section class="win-dialog" role="dialog" aria-modal="true" aria-labelledby="winTitle"><header class="game-titlebar"><h2 id="winTitle">Congratulations!</h2><button id="exitWin" class="circle-control panel-close" type="button" aria-label="Close celebration and return to game home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div id="confetti" class="confetti" aria-hidden="true"></div><div id="winStars" class="win-medal" role="img"></div><p id="winSummary"></p><button id="playNextLevel" class="primary-button" type="button">Play Next Level ▶</button></section></div>
<div id="pausePanel" class="pause-overlay" hidden><section role="dialog" aria-modal="true" aria-labelledby="pauseTitle"><header class="game-titlebar"><h2 id="pauseTitle">Game paused</h2><button id="closePause" class="circle-control panel-close" type="button" aria-label="Close pause panel and resume game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><button id="resumeGame" class="primary-button" type="button">Resume</button></section></div>
</main><link rel="stylesheet" href="info-panel.css?v=1.0.59"><script src="waste-guide.js?v=1.0.59"></script><script src="info-panel.js?v=1.0.59"></script><script src="items.js?v=1.0.59"></script><script src="stats.js?v=1.0.59"></script><script src="game.js?v=1.0.59"></script></body></html>
