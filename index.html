<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123453"><meta name="description" content="Household waste collection times in Malta and Gozo."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css?v=24"><title>Bag Day Malta</title></head>
<body><main class="app">
  <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">▦</div><span>Bag Day <span class="brand-sub">Malta</span></span></div><div class="top-actions"><button id="settingsButton" class="icon-button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10.6 2h2.8l.5 2.1c.6.2 1.2.4 1.8.8l1.9-1.1 2 2-1.1 1.9c.4.6.6 1.2.8 1.8l2.1.5v2.8l-2.1.5c-.2.6-.4 1.2-.8 1.8L3.8 6.4l2-2 1.9 1.1c.6-.4 1.2-.6 1.8-.8L10.6 2Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header>
  <section id="dashboard" class="dashboard" hidden>
    <div id="eyebrow" class="eyebrow"></div>
    <div class="day-nav"><button id="prevDay" class="nav-button" aria-label="Previous day">‹</button><div class="day-titles"><h1 id="title"></h1><p id="date"></p></div><button id="nextDay" class="nav-button" aria-label="Next day">›</button></div>
    <div id="todayPill" class="today-pill"></div>
    <div id="locationModeBar" class="location-mode-bar" hidden><span id="locationModeText"></span><button id="returnHomeButton" type="button" hidden></button></div>
    <div id="bagArea" class="bag-area" aria-live="polite"></div>
    <p id="swipeHint" class="swipe-hint"></p>
    <div id="locationNotice" class="location-notice" hidden><svg class="notice-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3 30 28H2L16 3Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 12v8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="24" r="1.4" fill="currentColor"/></svg><div class="notice-copy"><strong id="noticeText"></strong><p id="noticeQuestion"></p></div><button id="switchButton" class="switch-button"></button></div>
  </section>
  <button id="donationCard" class="donation-card" type="button" aria-haspopup="dialog" aria-controls="supportOverlay" hidden><span class="donation-copy"><span id="donationText"></span><small id="donationDetail"></small></span><span id="donationButton" class="donation-button" aria-hidden="true"></span></button>
  <footer><a id="sourceLink" href="https://www.wastecollection.mt/" target="_blank" rel="noopener"></a><span id="sourceNote"></span></footer>
</main>
<div id="settingsOverlay" class="overlay" hidden><section id="settingsDialog" class="settings organised-settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
<div class="settings-head"><span id="settingsEyebrow" class="small-label"></span><button id="closeSettings" class="close-button" type="button">×</button></div><h2 id="settingsTitle"></h2>
<section class="settings-section" aria-labelledby="homeLocalityTitle"><h3 id="homeLocalityTitle"></h3><select id="homeLocalitySelect" aria-labelledby="homeLocalityTitle"><option id="homeLocalityPlaceholder" value="" disabled></option></select></section>
<section class="settings-section" aria-labelledby="locationBehaviourLabel"><h3 id="locationBehaviourLabel"></h3><div class="location-behaviour"><label class="behaviour-option"><input id="keepLocalityMode" type="radio" name="locationBehaviour" value="keep"><span><strong id="keepLocalityTitle"></strong></span></label><label class="behaviour-option"><input id="followLocationMode" type="radio" name="locationBehaviour" value="follow"><span><strong id="followLocationTitle"></strong></span></label></div></section>
<section class="settings-section" aria-labelledby="supportSettingsTitle"><h3 id="supportSettingsTitle"></h3><label class="support-check"><input id="showSupport" type="checkbox"><span id="showSupportLabel"></span></label></section>
<button id="cancelSettings" class="cancel-button settings-done" type="button"></button>
</section></div>
<div id="supportOverlay" class="overlay" hidden><section id="supportDialog" class="settings support-modal" role="dialog" aria-modal="true" aria-labelledby="supportTitle" aria-describedby="supportMathExplanation">
<div class="settings-head"><span class="small-label">ZejtunSoft</span><button id="closeSupport" class="close-button" type="button" aria-label="Close">×</button></div>
<h2 id="supportTitle"></h2>
<p class="coffee-invitation"><svg class="coffee-cup" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M10 18h25v12c0 7-5 11-12.5 11S10 37 10 30V18Z" fill="#e4b874" stroke="currentColor" stroke-width="2"/><path d="M35 21h3a6 6 0 0 1 0 12h-4M7 43h32M17 12c-4-4 4-5 0-9M25 12c-4-4 4-5 0-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span id="supportIntro"></span></p>
<div class="support-math"><p id="supportMathExplanation"></p><div class="support-sum"><span id="supportMathFirst" class="sum-number" aria-hidden="true"></span><span aria-hidden="true">+</span><span id="supportMathSecond" class="sum-number" aria-hidden="true"></span><span aria-hidden="true">=</span><input id="supportMathAnswer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" spellcheck="false" aria-describedby="supportMathExplanation supportMathStatus"></div><small id="supportMathStatus" role="status" aria-live="polite"></small></div>
<div id="tipAmounts" class="tip-amounts" role="group"><button id="tip2" class="tip-circle" type="button" disabled>€2</button><button id="tip5" class="tip-circle" type="button" disabled>€5</button><button id="tip10" class="tip-circle" type="button" disabled>€10</button><button id="tip20" class="tip-circle" type="button" disabled>€20</button></div><p id="tipThanks" class="tip-thanks"></p>
<button id="dismissSupport" class="cancel-button" type="button"></button>
<label class="support-check support-hide-bottom"><input id="hideSupport" type="checkbox"><span id="hideSupportLabel"></span></label>
</section></div>
<script src="data.js?v=24"></script><script src="app.js?v=24"></script></body></html>
